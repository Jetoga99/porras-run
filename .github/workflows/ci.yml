name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Lint, tipos, formato y build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Revisar tipos
        run: npm run typecheck

      - name: Revisar formato
        run: npm run format:check

      - name: Exportar web
        run: npm run export:web

  api:
    name: Pruebas de la API con PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porras_test
          POSTGRES_USER: porras
          POSTGRES_PASSWORD: porras_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U porras -d porras_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de la API
        run: npm run test:api
        env:
          TEST_DATABASE_URL: postgres://porras:porras_local@localhost:5432/porras_test

      - name: Build de la API
        run: npm run build -w @porras/api
