# Encabezados de seguridad de PorraRun.
# Se incluyen en el bloque server y otra vez en cada location que usa add_header,
# porque en Nginx un add_header dentro de una location ANULA los heredados del server.

# Obliga a usar HTTPS durante un año (HSTS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Qué puede cargar la página. El hash permite el único script en línea que genera Expo
# (globalThis.__EXPO_ROUTER_HYDRATE__=true;). Si Expo lo cambia: node scripts/csp-hash.mjs
# 'unsafe-inline' en estilos es necesario porque React Native Web inyecta estilos en línea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# El navegador no adivina tipos de archivo (evita ejecutar un .txt como script).
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede mostrar PorraRun dentro de un iframe (clickjacking).
add_header X-Frame-Options "DENY" always;

# Al seguir un enlace externo solo se comparte el dominio, no la ruta completa.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Funciones del dispositivo: micrófono solo para PorraRun (audios en la Fase 3); nada más.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;

# Aísla la ventana de otras pestañas de otros orígenes.
add_header Cross-Origin-Opener-Policy "same-origin" always;
