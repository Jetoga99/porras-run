# Nginx para la web exportada de PorraRun, servida en http://localhost/porras
# El build de `npm run export:web` (apps/mobile/dist) se monta en /usr/share/nginx/html/porras.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # No anunciar la versión de Nginx en errores ni en el header Server.
    server_tokens off;

    # Redirecciones relativas: conservan el puerto si no es el 80.
    absolute_redirect off;
    charset utf-8;

    # Compresión: el JS principal baja de ~1.7 MB a ~400 KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /porras/;
    }

    location = /porras {
        return 301 /porras/;
    }

    # Archivos de Expo con hash en el nombre: nunca cambian, se pueden guardar un año.
    location /porras/_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas dinámicas: un slug o id que no se pre-generó cae en la plantilla [param].html
    # y Expo Router lo resuelve en el navegador. Así no se pierde /porras al recargar.
    location ~ ^/porras/c/[^/]+/?$ {
        try_files $uri $uri.html /porras/c/[slug].html;
    }

    location ~ ^/porras/carreras/[^/]+/?$ {
        try_files $uri $uri.html /porras/carreras/[id].html;
    }

    location /porras/ {
        # El HTML se revisa en cada visita para que un despliegue nuevo se vea de inmediato.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /porras/+not-found.html;
    }
}
