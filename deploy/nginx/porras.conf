# Nginx de PorraRun: https://porras.local
#   /porras/  -> web exportada por Expo (apps/mobile/dist)
#   /api/     -> API Express (contenedor "api", puerto 3000)

# HTTP: todo se redirige a HTTPS.
server {
    listen 80;
    server_name porras.local localhost;
    server_tokens off;
    return 301 https://porras.local$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name porras.local;

    # Certificado local generado con mkcert (ver INSTALL.md); no se versiona.
    ssl_certificate     /etc/nginx/certs/porras.local.pem;
    ssl_certificate_key /etc/nginx/certs/porras.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    # No anunciar la versión de Nginx en errores ni en el header Server.
    server_tokens off;
    # Redirecciones relativas: conservan el puerto si no es el 443.
    absolute_redirect off;
    charset utf-8;

    # Compresión: el JS principal baja de ~1.8 MB a ~0.4 MB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = / {
        return 302 /porras/;
    }

    location = /porras {
        return 301 /porras/;
    }

    # API: Nginx es la puerta de entrada y reenvía al contenedor de Express.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        # helmet (en Express) manda sus propios headers; se ocultan para no duplicarlos,
        # así Nginx es la única fuente de los headers de seguridad.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
    }

    # Archivos de Expo con hash en el nombre: nunca cambian, se pueden guardar un año.
    location /porras/_expo/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas dinámicas: un slug o id cae en la plantilla [param].html
    # y Expo Router lo resuelve en el navegador. Así no se pierde /porras al recargar.
    location ~ ^/porras/c/[^/]+/?$ {
        try_files $uri $uri.html /porras/c/[slug].html;
    }

    location ~ ^/porras/carreras/[^/]+/?$ {
        try_files $uri $uri.html /porras/carreras/[id].html;
    }

    location /porras/ {
        include /etc/nginx/snippets/security-headers.conf;
        # El HTML se revisa en cada visita para que un despliegue nuevo se vea de inmediato.
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /porras/+not-found.html;
    }
}
