# Servidor local de PorraRun. Uso:
#   npm run export:web
#   docker compose up -d
# y abrir http://localhost/porras
services:
  web:
    image: nginx:1.29-alpine
    container_name: porras-web
    ports:
      # Si el puerto 80 está ocupado: $env:PORRAS_HTTP_PORT=8080; docker compose up -d
      - '${PORRAS_HTTP_PORT:-80}:80'
    volumes:
      - ./apps/mobile/dist:/usr/share/nginx/html/porras:ro
      - ./deploy/nginx/porras.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
